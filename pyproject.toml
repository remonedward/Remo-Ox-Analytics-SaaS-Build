[project]
name = "remo-ox-analytics"
version = "1.0.0"
description = "REMO_OX Analytics - Smart Business Analytics SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.45.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl==3.1.5",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "rapidFuzz>=3.12.0",
    "litellm>=1.68.0",
    "supabase>=2.15.0",
    "matplotlib>=3.9.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "fpdf2>=2.8.0",
    "uharfbuzz>=0.56.0",
]

[tool.ruff]

target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) allowed
    "RUF001",  # Ambiguous unicode characters (normal for Arabic text/digits)
    "RUF002",  # Ambiguous docstring characters
    "RUF003",  # Ambiguous comment characters
    "E501",    # Line length handled gracefully
    "E402",    # Future import placement relative to docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "E501", "E402"]
"sample_data/*" = ["ANN", "S", "E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=analytics --cov=data --cov=ai --cov-report=term-missing --cov-fail-under=80"
